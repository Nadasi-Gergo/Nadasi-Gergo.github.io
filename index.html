<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Szerverfeladat 2026</title>
    <style>
        /* Teljes képernyős sötétzöld háttér és középre rendezés */
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #006400; /* Sötétzöld háttér (DarkGreen) */
            font-family: Arial, sans-serif;
        }

        /* Középső felirat stílusa */
        .content h1 {
            color: #ffffff; /* Fehér szöveg */
            font-size: 3rem;
            margin: 0;
            font-weight: normal;
        }

        /* Jobb alsó sarokba rögzített letöltő link / gomb */
        .download-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background-color: #ffffff;
            color: #006400;
            padding: 10px 18px;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .download-btn:hover {
            background-color: #f0f0f0;
            color: #004d00;
        }
    </style>
</head>
<body>

    <!-- A képen látható középső szöveg -->
    <div class="content">
        <h1>Nádasi Gergő</h1>
    </div>

    <!-- Jobb alsó sarok lévő Word letöltő link -->
    <a href="ftp.pdf" class="download-btn" download>PDF dokumentum letöltése</a>

</body>
</html>
